[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[project]
name = "mystops"
version = "3.0.0.dev0"
description = "MyStops - TriMet arrivals on a map"
authors = [{ name = "Wyatt Baldwin", email = "code@wyattbaldwin.com" }]
license = { text = "private" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "org-djangokit-core>=0.0.5.dev0",
    "org-djangokit-cli>=0.0.8.dev0",
    "Django>=6.0.3",
    "markdown>=3.10.2",
    "mercantile>=1.2.1",
    "psycopg>=3.3.3",
    "pydantic>=2.12.5",
    "pymemcache>=4.0.0",
    "requests>=2.33.0",
    "runcommands>=1.0a74.dev0",
    "tzlocal>=5.3.1",
]

[dependency-groups]
dev = [
    "ansible>=13.5.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]

[tool.uv.sources]
org-djangokit-core = { path = "../djangokit/core", editable = true }
org-djangokit-cli = { path = "../djangokit/cli", editable = true }
runcommands = { path = "../runcommands", editable = true }

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"commands.py" = ["F722", "F821"]

[tool.runcommands.globals]
env = "development"

[tool.runcommands.envs]
development = { }
production.host = "app-1.wyattbaldwin.com"
production.public_hostname = "mystops.io"
