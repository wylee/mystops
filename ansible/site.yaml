---
- name: Provision
  hosts:
    - web
  become: true
  roles:
    - base
    - provision
  tags:
    - provision

- name: Prepare
  hosts:
    - localhost
  roles:
    - base
    - prepare
  tags:
    - prepare
  environment:
    DYLD_LIBRARY_PATH: "{{ lookup('env', 'DYLD_LIBRARY_PATH') }}"

- name: Deploy
  hosts:
    - web
  roles:
    - base
    - deploy
  tags: deploy
